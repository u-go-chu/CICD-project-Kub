apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-puppy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-puppy
  template:
    metadata:
      labels:
        app: blue-puppy
    spec:
      containers:
        - name: blue-puppy
          image: uggoiffi/blue-puppy-repo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: db
            - name: DB_NAME
              valueFrom:
                secretKeyRef: {name: db-secret, key: POSTGRES_DB}
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: db-secret, key: POSTGRES_USER}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-secret, key: POSTGRES_PASSWORD}
---
apiVersion: v1
kind: Service
metadata:
  name: blue-puppy
spec:
  selector:
    app: blue-puppy
  ports:
    - port: 80
      targetPort: 5000