<!DOCTYPE html>
<html>
<head>
  <title>Items</title>
  <style>
    body { font-family: Arial, sans-serif; background: #e8f5e9; color: #1b5e20; padding: 20px; }
    h1, h2 { color: #2e7d32; }
    input { padding: 6px; margin: 2px; }
    button { background: #2e7d32; color: white; border: none; padding: 7px 14px; cursor: pointer; }
    button:hover { background: #1b5e20; }
  </style>
</head>
<body>
  <h1>Add item</h1>
  <form method="POST">
    <input name="name" placeholder="Name" required>
    <input name="colour" placeholder="Colour" required>
    <input name="quantity" type="number" placeholder="Quantity" required>
    <button type="submit">Add</button>
  </form>

  <h2>Items</h2>
  <ul>
    {% for i in items %}
      <li>{{ i.name }} - {{ i.colour }} - {{ i.quantity }}</li>
    {% endfor %}
  </ul>
</body>
</html>
