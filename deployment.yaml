apiVersion: apps/v1
kind: Deployment

metadata:
  name: blue-puppy

spec:
  replicas: 2

  selector:
    matchLabels:
      app: blue-puppy

  template:
    metadata:
      labels:
        app: blue-puppy

    spec:
      containers:
        - name: blue-puppy
          image: uggoiffi/blue-puppy-repo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
